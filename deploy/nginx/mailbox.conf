limit_req_zone $binary_remote_addr zone=mailbox_auth:10m rate=5r/m;

server {
    listen 80;
    server_name mailbox.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mailbox.example.com;

    ssl_certificate /etc/letsencrypt/live/mailbox.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailbox.example.com/privkey.pem;

    root /var/www/mailbox/web;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/auth/(login|password-reset|passkeys) {
        limit_req zone=mailbox_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
